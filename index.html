<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>David Meneses's Portfolio</title>
<meta name="description" content="Interactive portfolio of illustrations and university projects by David Meneses.">
<meta name="theme-color" content="#cbe7f7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2362c1ef'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout concept: a light, glossy channel menu. A short intro shows the name, then the main menu offers two
   large channels (Personal / Professional). A channel opens as a grid of tiles; a tile zooms to fullscreen.
   A curved bottom bar holds Menu, a live clock and Back. Palette: white, grey and celeste, one light theme
   on purpose (no dark scheme). All type is Arial. */
:root {
  color-scheme: light;
  --bg: #e9ecef;
  --bg-top: #ffffff;
  --bg-bot: #cbe7f7;
  --surface: #ffffff;
  --surface-2: #f3f5f7;
  --edge: #cbd2d9;
  --edge-soft: #e0e4e8;
  --ink: #2a3037;
  --ink-dim: #5d6670;
  --digits: #8a949e;
  --blue: #62c1ef;
  --blue-strong: #2f9fd6;
  --blue-text: #17658c;
  --blue-soft: #cdeafa;
  --rim: #a8dbf4;
  --glow: rgba(98, 193, 239, .55);
  --btn-top: #ffffff;
  --btn-bot: #d4e9f5;
  --gloss: rgba(255, 255, 255, .6);
  --emboss: rgba(255, 255, 255, .95);
  --veil: rgba(244, 247, 250, .86);
  --shadow: rgba(52, 62, 74, .18);
  --scrim: rgba(233, 236, 239, .97);
  --scrim-ink: #2a3037;
  --float-ink: #808080;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: env(safe-area-inset-top, 0px);
  --gb: env(safe-area-inset-bottom, 0px);
  --bar-h: 92px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
ul { list-style: none; margin: 0; padding: 0; }
img { display: block; }
:focus-visible { outline: 3px solid var(--blue-strong); outline-offset: 3px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------ app shell */
.app {
  position: fixed; inset: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
}
.bgfx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bgfx i { position: absolute; border-radius: 50%; }
.bgfx i:nth-child(1) { width: 70vmax; height: 70vmax; left: -26vmax; top: -34vmax; background: radial-gradient(circle, var(--blue-soft), transparent 66%); opacity: .9; animation: drift 40s ease-in-out infinite alternate; }
.bgfx i:nth-child(2) { width: 58vmax; height: 58vmax; right: -24vmax; bottom: -30vmax; background: radial-gradient(circle, var(--blue-soft), transparent 66%); opacity: .75; animation: drift 52s ease-in-out infinite alternate-reverse; }
.bgfx i:nth-child(3) { width: 90vmax; height: 38vmax; left: -10vmax; top: -12vmax; border-radius: 0 0 50% 50%; background: linear-gradient(180deg, var(--gloss), transparent); }
@keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.08); } }
/* floating marks: the hand-drawn PNGs listed in FLOATERS (script). Grey, 50% opacity, they drift, fade in, hold, fade out and come back somewhere else. */
.floaters { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.floater { position: absolute; left: var(--x); top: var(--y); width: var(--sz, 34px); height: var(--sz, 34px); object-fit: contain; opacity: 0; user-select: none; -webkit-user-drag: none; will-change: transform, opacity; animation: float var(--dur) linear var(--delay) infinite; }
@keyframes float {
  0%   { opacity: 0;  transform: translate(0, 0) rotate(0deg) scale(.7); }
  9%   { opacity: 0;  transform: translate(calc(var(--dx) * .09), calc(var(--dy) * .09)) rotate(calc(var(--rot) * .09)) scale(.75); }
  24%  { opacity: .5; transform: translate(calc(var(--dx) * .24), calc(var(--dy) * .24)) rotate(calc(var(--rot) * .24)) scale(1); }
  72%  { opacity: .5; transform: translate(calc(var(--dx) * .72), calc(var(--dy) * .72)) rotate(calc(var(--rot) * .72)) scale(1); }
  88%  { opacity: 0;  transform: translate(calc(var(--dx) * .88), calc(var(--dy) * .88)) rotate(calc(var(--rot) * .88)) scale(.85); }
  100% { opacity: 0;  transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.8); }
}
/* explosion of marks when a menu option or project is pressed */
.burst { position: absolute; inset: 0; z-index: 40; overflow: hidden; pointer-events: none; }
.bm { position: absolute; object-fit: contain; opacity: 0; will-change: transform, opacity; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 5px rgba(255, 255, 255, .85)); -webkit-user-drag: none; user-select: none; }
.bring { position: absolute; border-radius: 50%; border: 3px solid var(--blue); box-shadow: 0 0 30px var(--glow); opacity: 0; will-change: transform, opacity; }

.view { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: calc(18px + var(--gt)) var(--gr) calc(var(--bar-h) + var(--gb) + 22px) var(--gl); overscroll-behavior: contain; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-text); }

/* ----------------------------------------------------------------- intro */
.boot { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; padding: var(--gt) var(--gr) var(--gb) var(--gl); background: none; cursor: pointer; overflow: hidden; }
.boot::before { content: ""; position: absolute; left: -10%; right: -10%; top: -30%; height: 70%; border-radius: 0 0 50% 50%; background: linear-gradient(180deg, var(--gloss), transparent); }
.boot-ring { position: absolute; left: 50%; top: 50%; width: min(86vmin, 760px); aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--blue); opacity: 0; transform: translate(-50%, -50%) scale(.2); animation: ring 2.6s cubic-bezier(.2, .7, .2, 1) .15s both; }
.boot-ring.r2 { border-width: 1px; animation-delay: .6s; }
@keyframes ring { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); } 18% { opacity: .75; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.12); } }
.boot-core { position: relative; display: grid; justify-items: center; gap: 22px; }
.boot-title { font-size: clamp(32px, 8.2vw, 88px); font-weight: 700; line-height: 1.06; letter-spacing: -.01em; color: var(--ink); }
.boot-title .w { display: block; white-space: nowrap; }
.boot-title .w.accent { color: var(--blue-strong); }
.boot-title .ch { display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(16px); animation: chin .75s cubic-bezier(.2, .7, .2, 1) calc(.5s + var(--i) * 42ms) both; }
@keyframes chin { to { opacity: 1; filter: blur(0); transform: none; } }
.boot-line { width: min(300px, 56vw); height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--blue), transparent); transform: scaleX(0); animation: line 1s ease 1.55s forwards; }
@keyframes line { to { transform: scaleX(1); } }
.boot-sub { font-size: clamp(12px, 1.6vw, 15px); font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-dim); opacity: 0; animation: fadeup .8s ease 1.9s forwards; }
.boot-hint { position: absolute; left: 0; right: 0; bottom: calc(26px + var(--gb)); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); opacity: 0; animation: fadeup .8s ease 2.6s forwards; }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.boot.out { animation: bootout .75s cubic-bezier(.65, 0, .25, 1) forwards; pointer-events: none; }
@keyframes bootout { to { opacity: 0; transform: scale(1.14); filter: blur(6px); } }

/* ------------------------------------------------------------- main menu */
.home { display: flex; flex-direction: column; align-items: center; }
.home-inner { margin: auto 0; width: min(1080px, 100%); display: grid; justify-items: center; }
.home-head { text-align: center; margin: 0 0 clamp(18px, 4vh, 40px); display: grid; gap: 6px; }
.home-name { font-size: 12px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-dim); }
.home-lead { font-size: clamp(22px, 3.4vw, 32px); font-weight: 700; color: var(--ink); }
.chans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 3vw, 40px); width: 100%; }
.chan { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--edge-soft); border-radius: 26px; padding: 12px 12px 18px; box-shadow: 0 14px 40px var(--shadow); transition: transform .28s cubic-bezier(.2, .7, .2, 1), box-shadow .28s, border-color .28s; }
.chan:hover, .chan:focus-visible { transform: translateY(-6px) scale(1.015); border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue), 0 0 38px var(--glow), 0 20px 44px var(--shadow); outline: none; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 16px; background: var(--surface-2); }
.mosaic img { width: 100%; height: 100%; object-fit: cover; min-height: 0; }
.chan-cap { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 8px; flex-wrap: wrap; }
.chan-name { display: block; font-size: clamp(24px, 3vw, 30px); font-weight: 700; line-height: 1.1; color: var(--ink); }
.chan-lead { display: block; margin-top: 4px; font-size: 14px; color: var(--ink-dim); }
.chan-badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: var(--blue-soft); color: var(--blue-text); font-size: 13px; font-weight: 700; white-space: nowrap; }
.chan-badge svg { width: 16px; height: 16px; }
.home.enter .home-head { animation: fadeup .7s ease both; }
.home.enter .chan { animation: pop .8s cubic-bezier(.2, .8, .2, 1) calc(.1s + var(--d, 0ms)) both; }
@keyframes pop { from { opacity: 0; transform: translateY(34px) scale(.92); } to { opacity: 1; transform: none; } }

/* -------------------------------------------------------------- channel grid */
.cat-head { width: min(1120px, 100%); margin: clamp(4px, 2vh, 20px) auto 20px; display: grid; gap: 4px; }
.cat-head h2 { font-size: clamp(28px, 4vw, 42px); font-weight: 700; line-height: 1.1; color: var(--ink); }
.cat-head h2:focus { outline: none; }
.cat-lead { color: var(--ink-dim); max-width: 62ch; }
.grid { --cols: 4; --gap: clamp(12px, 1.8vw, 22px); width: min(1120px, 100%); margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap); }
@media (max-width: 1000px) { .grid { --cols: 3; } }
@media (max-width: 700px) { .grid { --cols: 2; } }
.tile { flex: 0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols)); min-width: 0; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--edge-soft); border-radius: 20px; padding: 8px 8px 12px; box-shadow: 0 10px 28px var(--shadow); transition: transform .25s cubic-bezier(.2, .7, .2, 1), box-shadow .25s, border-color .25s; }
.tile:hover, .tile:focus-visible { transform: translateY(-5px) scale(1.03); border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue), 0 0 30px var(--glow), 0 16px 32px var(--shadow); outline: none; z-index: 2; }
.tile-img { display: block; aspect-ratio: 5 / 4; overflow: hidden; border-radius: 13px; background: var(--surface-2); }
.tile-img img { width: 100%; height: 100%; object-fit: cover; }
.tile-motif { display: grid; place-items: center; background: linear-gradient(160deg, var(--blue-soft), var(--surface-2)); color: var(--blue-text); }
.tile-motif svg { width: 46%; height: auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile-cap { display: grid; gap: 1px; padding: 0 6px; min-width: 0; }
.tile-cap b { font-size: 14px; line-height: 1.25; color: var(--ink); overflow-wrap: anywhere; }
.tile-cap small { font-size: 12px; color: var(--ink-dim); }
.cat.enter .tile { animation: pop .7s cubic-bezier(.2, .8, .2, 1) calc(var(--d, 0ms)) both; }

/* ------------------------------------------------------------ fullscreen item */
.item { overflow: hidden; padding: 0; }
.item-bg { position: absolute; inset: -4%; background-size: cover; background-position: center; filter: blur(34px) saturate(.6); transform: scale(1.08); }
.item-veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(205, 234, 250, .38)), var(--veil); }
.item-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: calc(20px + var(--gt)) var(--gr) calc(var(--bar-h) + var(--gb) + 20px) var(--gl); overscroll-behavior: contain; }
.item-body { height: 100%; width: min(1240px, 100%); margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--edge-soft); border-radius: 22px; box-shadow: 0 14px 40px var(--shadow); }
.card h2 { font-size: clamp(26px, 3.2vw, 36px); line-height: 1.12; font-weight: 700; color: var(--ink); overflow-wrap: anywhere; }
.card h2:focus { outline: none; }
.lead { color: var(--ink); font-size: 16px; line-height: 1.55; }
.official { font-size: 13px; color: var(--ink-dim); line-height: 1.45; }
.copy { color: var(--ink-dim); font-size: 14.5px; line-height: 1.6; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags li { padding: 5px 12px; border-radius: 999px; background: var(--blue-soft); color: var(--blue-text); font-size: 12.5px; font-weight: 700; }

/* illustration */
.ill { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 340px); grid-template-rows: minmax(0, 1fr); gap: 24px; align-items: stretch; }
.ill-stage { position: relative; min-height: 0; display: grid; place-items: center; touch-action: pan-y; }
.ill-pic { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 0; cursor: zoom-in; }
.ill-pic img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border: 8px solid var(--surface); border-radius: 16px; background: var(--surface); box-shadow: 0 22px 56px var(--shadow); }
.side { display: flex; flex-direction: column; gap: 14px; padding: 24px; align-self: center; max-height: 100%; overflow: auto; }
.side .count { font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.mini { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.details { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.details button { display: block; width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid var(--edge-soft); transition: border-color .2s, transform .2s; }
.details button:hover, .details button:focus-visible { border-color: var(--blue); transform: translateY(-2px); }
.details img { width: 100%; aspect-ratio: 1; object-fit: cover; }
.details span { display: block; font-size: 11.5px; padding: 4px 6px; color: var(--ink-dim); background: var(--surface-2); }
.hint { font-size: 12.5px; color: var(--ink-dim); }
.stage-ar { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, var(--btn-top), var(--btn-bot)); border: 2px solid var(--edge); box-shadow: 0 6px 16px var(--shadow); color: var(--ink-dim); transition: border-color .2s, color .2s, box-shadow .2s; }
.stage-ar:hover, .stage-ar:focus-visible { border-color: var(--blue); color: var(--blue-text); box-shadow: 0 0 0 3px var(--glow), 0 6px 16px var(--shadow); outline: none; }
.stage-ar svg { width: 22px; height: 22px; }
.stage-ar.prev { left: 6px; }
.stage-ar.next { right: 6px; }

/* project */
.proj { height: 100%; display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 24px; }
.text { display: flex; flex-direction: column; gap: 14px; padding: 26px; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
.text.more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 38px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 38px), transparent); }
.pn { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 10px; }
.pn button { flex: 1 1 140px; min-width: 0; display: grid; gap: 1px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--edge); background: var(--surface-2); transition: border-color .2s, box-shadow .2s; }
.pn button:hover, .pn button:focus-visible { border-color: var(--blue); box-shadow: 0 0 0 2px var(--glow); outline: none; }
.pn small { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.pn b { font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
.pn .nx { text-align: right; }
.viewer { min-height: 0; min-width: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 12px; }
.vstage { position: relative; min-height: 0; border-radius: 22px; background: var(--surface); border: 1px solid var(--edge-soft); box-shadow: 0 14px 40px var(--shadow); overflow: hidden; touch-action: pan-y; }
.vpic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; cursor: zoom-in; }
.vpic img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
.vcap { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 0 6px; }
.vcap h3 { font-size: 16px; color: var(--ink); }
.vcap p { font-size: 13.5px; color: var(--ink-dim); margin-top: 2px; max-width: 70ch; }
.vcount { font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vthumbs { position: relative; display: flex; gap: 8px; overflow-x: auto; padding: 4px 4px 8px; scrollbar-width: thin; }
.vthumbs li { flex: 0 0 auto; }
.vthumbs button { display: block; width: 84px; height: 62px; border-radius: 10px; overflow: hidden; border: 2px solid var(--edge-soft); background: var(--surface); opacity: .8; transition: border-color .2s, opacity .2s, transform .2s; }
.vthumbs button:hover { opacity: 1; transform: translateY(-2px); }
.vthumbs button[aria-current="true"] { border-color: var(--blue); opacity: 1; box-shadow: 0 0 0 3px var(--glow); }
.vthumbs img { width: 100%; height: 100%; object-fit: contain; }
.vmotifs { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 12px; padding: 14px; }
.vmotifs li { display: grid; place-items: center; align-content: center; gap: 10px; border-radius: 16px; background: linear-gradient(160deg, var(--blue-soft), var(--surface-2)); color: var(--blue-text); padding: 12px; text-align: center; font-weight: 700; font-size: 14px; }
.vmotifs svg { width: 64px; height: auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------------------------------------------------------------- bottom bar */
.bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(var(--bar-h) + var(--gb)); padding: 8px var(--gr) var(--gb) var(--gl); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; transition: transform .8s cubic-bezier(.2, .7, .2, 1); }
.bar::before { content: ""; position: absolute; left: -6%; right: -6%; top: 0; bottom: 0; z-index: -1; background: var(--surface); border-top: 2px solid var(--rim); border-radius: 50% 50% 0 0 / 34px 34px 0 0; box-shadow: 0 -4px 22px var(--glow), 0 -10px 34px var(--shadow); }
.app[data-view="boot"] .bar { transform: translateY(115%); }
.bar-side { display: grid; justify-items: center; gap: 3px; }
.bar-left { justify-self: end; padding-right: clamp(14px, 6vw, 84px); }
.bar-right { justify-self: start; padding-left: clamp(14px, 6vw, 84px); }
.rb { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(180deg, var(--btn-top) 0%, var(--btn-bot) 100%); border: 2px solid var(--rim); color: var(--ink-dim); box-shadow: inset 0 2px 0 var(--emboss), 0 6px 14px var(--shadow); transition: border-color .2s, color .2s, box-shadow .2s, transform .2s; }
.rb svg { width: 26px; height: 26px; }
.rb:hover:not([aria-disabled="true"]), .rb:focus-visible { border-color: var(--blue); color: var(--blue-text); box-shadow: inset 0 2px 0 var(--emboss), 0 0 0 4px var(--glow), 0 6px 14px var(--shadow); transform: translateY(-2px); outline: none; }
.rb[aria-disabled="true"] { opacity: .42; cursor: default; }
.rb-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.clock { text-align: center; line-height: 1; user-select: none; display: grid; gap: 7px; }
.clock-date { font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim); }
.clock-time { font-size: clamp(34px, 5vw, 46px); color: var(--digits); font-variant-numeric: tabular-nums; letter-spacing: .03em; text-shadow: 0 1px 0 var(--emboss); }
.colon { color: var(--blue-strong); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .18; } }

/* ----------------------------------------------------------------- zoom layer */
.zoomer { position: fixed; left: 0; top: 0; z-index: 20; background: var(--surface) center / cover no-repeat; box-shadow: 0 24px 70px var(--shadow); pointer-events: none; }

/* ---------------------------------------------------------------- lightbox */
.lb { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: var(--scrim); padding: calc(60px + var(--gt)) var(--gr) calc(64px + var(--gb)) var(--gl); overflow: hidden; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; } }
.lb-img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; background: #fff; box-shadow: 0 10px 40px var(--shadow); transition: transform .3s ease; }
.lb-img.is-zoom { transform: scale(2.4); cursor: zoom-out; }
.lb-btn { position: absolute; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(42, 48, 55, .22); background: rgba(255, 255, 255, .8); color: var(--scrim-ink); z-index: 2; }
.lb-btn:hover, .lb-btn:focus-visible { border-color: var(--blue); color: var(--blue-text); box-shadow: 0 0 0 3px var(--glow); outline: none; }
.lb-btn svg { width: 22px; height: 22px; }
.lb-close { right: var(--gr); top: calc(12px + var(--gt)); }
.lb-prev { left: var(--gl); top: 50%; margin-top: -23px; }
.lb-next { right: var(--gr); top: 50%; margin-top: -23px; }
.lb-cap { position: absolute; left: var(--gl); right: var(--gr); bottom: calc(18px + var(--gb)); text-align: center; font-size: 13px; letter-spacing: .06em; color: var(--scrim-ink); }

/* ----------------------------------------------------------------- narrow screens */
@media (max-width: 860px) {
  :root { --bar-h: 84px; }
  .chans { grid-template-columns: 1fr; width: min(520px, 100%); }
  .mosaic { aspect-ratio: 16 / 9; }
  .ill, .proj { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 16px; }
  .ill-stage { height: min(64vh, 112vw); }
  .side { align-self: auto; max-height: none; padding: 20px; }
  .text { overflow: visible; padding: 20px; }
  .viewer { grid-template-rows: auto auto auto; }
  .vstage { height: min(56vh, 92vw); }
  .vthumbs button { width: 72px; height: 54px; }
  .rb { width: 50px; height: 50px; }
  .stage-ar { width: 42px; height: 42px; }

@media (max-width: 440px) {

      else if (e.key === 'ArrowLeft') showLb(lbI - 1);
      return;
    }
    if (state.view === 'boot') { if (e.key !== 'Tab') endBoot(); return; }
    if (busy) return;
    if (e.key === 'Escape') { goBack(); return; }
    if (state.view === 'item') {
      var sec = SECS[state.sec];
      if (e.key === 'ArrowRight') { e.preventDefault(); if (sec.kind === 'ill') stepItem(1); else setShot(state.shot + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); if (sec.kind === 'ill') stepItem(-1); else setShot(state.shot - 1); }
      else if (e.key === 'PageDown') { e.preventDefault(); stepItem(1); }
      else if (e.key === 'PageUp') { e.preventDefault(); stepItem(-1); }
    } else if (state.view === 'cat' || state.view === 'home') {
      var sel = state.view === 'cat' ? '.tile' : '.chan', els = $$(sel, views[state.view]), i = els.indexOf(document.activeElement);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); (els[i + 1] || els[0]).focus(); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); (els[i - 1] || els[els.length - 1]).focus(); }
    }
  });

  /* swipe to move between illustrations or project images */
  (function () {
    var x0 = null, y0 = 0, host = $('#itemBody');
    host.addEventListener('pointerdown', function (e) { if (e.target.closest('.stage-ar, .vthumbs, .details, .side, .text')) { x0 = null; return; } x0 = e.clientX; y0 = e.clientY; });
    host.addEventListener('pointerup', function (e) {
      if (x0 === null || busy || state.view !== 'item') return;
      var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      var d = dx < 0 ? 1 : -1; swipeAt = Date.now();
      if (SECS[state.sec].kind === 'ill') stepItem(d); else setShot(state.shot + d);
      e.preventDefault();
    });
  })();


  /* ---------------------------------------------------------- floating marks */
  /* Hand-drawn marks (dog, phone, cat, lamp) drift around the background. Each one fades in, floats,
     fades out and reappears somewhere else. They are also the pieces of the explosion when a card is pressed.
     To change them: edit `images` (any transparent PNGs), `size` (pixels) or `perMegapixel` (how many). */
  var FLOATERS = {
    images: ['img/mark-dog.png', 'img/mark-phone.png', 'img/mark-cat.png', 'img/mark-lamp.png'],
    size: 34,
    perMegapixel: 26
  };
  FLOATERS.images.forEach(function (src) { var p = new Image(); p.src = src; });
  function floaterCount() {
    var n = Math.round(innerWidth * innerHeight / 1e6 * FLOATERS.perMegapixel);
    return Math.max(12, Math.min(60, n));
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  /* new random place, drift and spin; used at creation and again each time a mark has faded out */
  function scatter(el) {
    var s = el.style;
    s.setProperty('--x', rnd(0, 100).toFixed(2) + '%');
    s.setProperty('--y', rnd(0, 100).toFixed(2) + '%');
    s.setProperty('--dx', rnd(-130, 130).toFixed(0) + 'px');
    s.setProperty('--dy', rnd(-130, 130).toFixed(0) + 'px');
    s.setProperty('--rot', rnd(-70, 70).toFixed(0) + 'deg');
    s.setProperty('--sz', Math.round(FLOATERS.size * rnd(.8, 1.3)) + 'px');
  }
  function makeFloater(i) {
    var el = document.createElement('img'), dur = rnd(14, 30);
    el.src = FLOATERS.images[i % FLOATERS.images.length];
    el.alt = ''; el.draggable = false; el.decoding = 'async'; el.className = 'floater';
    scatter(el);
    el.style.setProperty('--dur', dur.toFixed(1) + 's');
    el.style.setProperty('--delay', (-rnd(0, dur)).toFixed(1) + 's');
    return el;
  }
  function syncFloaters() {
    var host = $('#floaters'); if (!host) return;
    var n = floaterCount();
    while (host.children.length < n) host.appendChild(makeFloater(host.children.length));
    while (host.children.length > n) host.removeChild(host.lastChild);
  }
  /* a new cycle starts while the mark is invisible, so it can be moved without anyone seeing a jump */
  $('#floaters').addEventListener('animationiteration', function (e) {
    if (e.target !== e.currentTarget && e.animationName === 'float') scatter(e.target);
  });
  var fz;
  window.addEventListener('resize', function () { clearTimeout(fz); fz = setTimeout(syncFloaters, 250); });
  syncFloaters();

  /* ------------------------------------------------------------------ start */
  buildTitle();
  bootTimer = setTimeout(endBoot, reduced() ? 1200 : 4600);
})();
</script>
</body>
</html>
